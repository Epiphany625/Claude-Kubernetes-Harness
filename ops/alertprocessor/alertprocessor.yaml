apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertprocessor
  namespace: ckh
  labels:
    app.kubernetes.io/name: alertprocessor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertprocessor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertprocessor
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: alertprocessor
          image: xinyangxu/alertprocessor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: alertprocessor
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alertprocessor
  namespace: ckh
  labels:
    app.kubernetes.io/name: alertprocessor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertprocessor
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
