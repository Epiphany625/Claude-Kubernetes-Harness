<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 10px;border:1px solid #e2e5eb;border-radius:8px;">
  <tr>
    <td style="padding:12px 14px;">
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;word-break:break-all;">$tool</span>
      <span style="display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:$risk_background;color:$risk_foreground;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;">$risk risk</span>
      <p style="margin:6px 0 0;font-size:14px;line-height:1.5;">$intent</p>
    </td>
  </tr>
</table>
